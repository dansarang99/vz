<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<title>SECAD — 도면174 평면도 (Top View)</title>
<style>
*{margin:0;padding:0;box-sizing:border-box}
body{background:#ddd;font-family:'Malgun Gothic',sans-serif;padding:20px;display:flex;flex-direction:column;align-items:center}
h2{font-size:14px;margin-bottom:10px;color:#333}
.sheet{background:#fff;border:2px solid #000;padding:20px;position:relative}
canvas{display:block}
</style>
</head>
<body>
<h2>연습도면 174 — 평면도 (Top View) 단독 검증</h2>
<div class="sheet">
<canvas id="cv" width="600" height="400"></canvas>
</div>

<script>
const cv = document.getElementById('cv');
const ctx = cv.getContext('2d');
const S = 3; // 1mm = 3px (확대)

// ── 치수 ──
const L = 150, W = 82;
const MargY = (W - 40) / 2; // 21mm
const RibT = 10, Gap = 20;
// Y 좌표들 (위에서부터)
const y0 = 0;
const y1 = MargY;           // 21
const y2 = MargY + RibT;    // 31
const y3 = MargY + RibT + Gap; // 51
const y4 = MargY + RibT * 2 + Gap; // 61
const y5 = W;               // 82

// X 좌표들
const xL = 0, xR = L;
const WingR = 15;
const WingCx = 15; // 좌측 끝에서 15mm 지점 반원 중심 (도면 비례상 가정)
const BossCx = 129; // 우측 보스 중심 (R21, 끝선에 접한다고 가정 150-21=129)
const Hole30x = L - 30; // 120
const Hole60x = L - 30 - 60; // 60

// ── 원점 ──
const OX = 75, OY = 75; 
const p=(x,y)=>[OX+x*S, OY+y*S];

// ── 그리기 유틸 ──
function O(lw=1.5,col='#000'){ctx.lineWidth=lw;ctx.strokeStyle=col;ctx.setLineDash([]);}
function CL(){ctx.lineWidth=0.7;ctx.strokeStyle='#c00';ctx.setLineDash([8,3,2,3]);}
function HD(){ctx.lineWidth=1;ctx.strokeStyle='#444';ctx.setLineDash([4,3]);}
function Dim(){ctx.lineWidth=0.7;ctx.strokeStyle='#000';ctx.setLineDash([]);ctx.font='11px Arial';ctx.fillStyle='#000';}

const line=(x1,y1,x2,y2)=>{ctx.beginPath();ctx.moveTo(...p(x1,y1));ctx.lineTo(...p(x2,y2));ctx.stroke();}
const circ=(x,y,r)=>{ctx.beginPath();ctx.arc(...p(x,y), r*S, 0, Math.PI*2);ctx.stroke();}
const arc=(x,y,r,a1,a2,cw=false)=>{ctx.beginPath();ctx.arc(...p(x,y), r*S, a1, a2, cw);ctx.stroke();}

// [1] 베이스 외곽
O(2);
ctx.beginPath();ctx.rect(...p(0,0), L*S, W*S);ctx.stroke();

// [2] 중앙 리브 수평선 (가로 띠)
O(1.5);
// 상단 리브
line(WingCx, y1, xR, y1);
line(WingCx, y2, xR, y2);
// 하단 리브
line(WingCx, y3, xR, y3);
line(WingCx, y4, xR, y4);

// [3] 우측 보스 상단부 투영
O(1.5);
// R21 보스 중심은 x=129 추정 (총길이 150 - R21 = 129)
// 상단 보스 (y=21~41 범위 중앙 y=31 아님, 중심y=26)
const Boss1Cy = y1 + RibT/2; // 26
const Boss2Cy = y3 + RibT/2; // 56
// 평면도에서 R21 보스는 폭 42, 리브 두께는 10? 
// 아, 원본 도면 보면 보스 두께와 리브 두께가 동일하게 10입니다!
// R21은 측면에서 본 반경이고, 정면에서 본 폭이 10mm인 원판입니다.
// 따라서 평면에서는 폭 10mm, 세로길이 42mm(R21*2)의 직사각형으로 보임.
// 직사각형 위치: 끝(150)에서 42mm 앞(108)까지?
// 등각도를 다시 보면 반원형 보스가 수직으로 서 있습니다. 
// 즉 평면에서 보스는 폭(두께) 10mm, 깊이(가로) 42mm의 직사각형 형상입니다.
line(BossCx - 21, y1, BossCx - 21, y2);
line(BossCx + 21, y1, BossCx + 21, y2);
line(BossCx - 21, y3, BossCx - 21, y4);
line(BossCx + 21, y3, BossCx + 21, y4);

// 보스 중심선
CL();
line(BossCx, y1-5, BossCx, y2+5);
line(BossCx, y3-5, BossCx, y4+5);

// 2-φ16 구멍 (위에서 보면 16x10 직사각형의 숨은선)
HD();
line(BossCx - 8, y1, BossCx - 8, y2);
line(BossCx + 8, y1, BossCx + 8, y2);
line(BossCx - 8, y3, BossCx - 8, y4);
line(BossCx + 8, y3, BossCx + 8, y4);

// [4] 좌측 날개 R15 마감
O(1.5);
// 상단 리브 끝
arc(WingCx, y1 + WingR, WingR, -Math.PI/2, Math.PI, true);
line(WingCx - WingR, y1 + WingR, WingCx, y2); // 실제 기하학적 접선처리 생략, 모식도
line(WingCx, y1, WingCx, y2); // R시작점

// 하단 리브 끝
arc(WingCx, y4 - WingR, WingR, Math.PI/2, Math.PI, false);
line(WingCx - WingR, y4 - WingR, WingCx, y3);
line(WingCx, y3, WingCx, y4);

// 2-φ10 구멍 (수직 구멍이므로 평면에서는 원으로 보임)
O(1.5);
circ(WingCx, y1 + RibT/2, 5); // 위쪽 리브 중앙
circ(WingCx, y3 + RibT/2, 5); // 아래쪽 리브 중앙

// 중심선
CL();
line(WingCx-8, y1+5, WingCx+8, y1+5);
line(WingCx, y1-3, WingCx, y1+13);
line(WingCx-8, y3+5, WingCx+8, y3+5);
line(WingCx, y3-3, WingCx, y3+13);

// [5] 바닥판 볼트홀 4-φ11
O(1.5);
// 상단 2개 (y1 아래쪽 공간은 아님, y1=21, y0=0 이므로 y=10 위치)
circ(Hole60x, 10.5, 5.5);
circ(Hole30x, 10.5, 5.5);
// 하단 2개 (y=82-10.5 = 71.5)
circ(Hole60x, W - 10.5, 5.5);
circ(Hole30x, W - 10.5, 5.5);

// 중심선
CL();
[Hole60x, Hole30x].forEach(x => {
  line(x-8, 10.5, x+8, 10.5); line(x, 10.5-8, x, 10.5+8);
  line(x-8, W-10.5, x+8, W-10.5); line(x, W-10.5-8, x, W-10.5+8);
});

// 전체 대칭 중심선
CL();
line(-10, W/2, L+10, W/2);

// ── 치수 표시 ──
Dim();
// 전체 150
line(0, -5, 0, -25); line(L, -5, L, -25);
line(0, -20, L, -20);
ctx.fillText("150", ...p(L/2, -26));

// 폭 82
line(L+5, 0, L+25, 0); line(L+5, W, L+25, W);
line(L+20, 0, L+20, W);
ctx.fillText("82", ...p(L+25, W/2));

// 바닥홀 30, 60
line(Hole60x, W+5, Hole60x, W+25);
line(Hole30x, W+5, Hole30x, W+25);
line(L, W+5, L, W+25);
line(Hole60x, W+20, L, W+20);
ctx.fillText("60", ...p((Hole60x+Hole30x)/2, W+14));
ctx.fillText("30", ...p((Hole30x+L)/2, W+14));

</script>
</body>
</html>
