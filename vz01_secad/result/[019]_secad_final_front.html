<!DOCTYPE html>
<html>
<head>
    <title>SECAD Drawing 174 - Final Front View</title>
    <style>
        body { margin: 0; background-color: #0f172a; color: #fff; font-family: monospace; display: flex; justify-content: center; align-items: center; height: 100vh; }
        svg { background-color: #1e293b; border: 1px solid #334155; box-shadow: 0 10px 30px rgba(0,0,0,0.5); }
        .outline { fill: none; stroke: #38bdf8; stroke-width: 1.5; stroke-linecap: round; stroke-linejoin: round; }
        .hidden { fill: none; stroke: #94a3b8; stroke-width: 1; stroke-dasharray: 4,3; }
        .center { fill: none; stroke: #ef4444; stroke-width: 0.8; stroke-dasharray: 12,3,3,3; }
        .grid { stroke: #334155; stroke-width: 0.5; }
    </style>
</head>
<body>
    <svg width="800" height="600">
        <!-- Background Grid -->
        <pattern id="grid" width="20" height="20" patternUnits="userSpaceOnUse">
            <path d="M 20 0 L 0 0 0 20" fill="none" class="grid"/>
        </pattern>
        <rect width="100%" height="100%" fill="url(#grid)" />
        <text x="20" y="40" font-family="monospace" font-size="20" fill="#38bdf8">SECAD FINAL MASTER: FRONT VIEW (제1/2/3 단면 분리 기법)</text>
        <text x="20" y="60" font-family="monospace" font-size="12" fill="#94a3b8">DIRECTOR'S ALGORITHM APPLIED: CORRECT ARC DIRECTION & RIB CONNECTION</text>

        <!-- Cartesian Coordinate Space (Origin at bottom-left, Y points UP) -->
        <g transform="translate(150, 450) scale(3, -3)">
            
            <!-- X/Y Axis (0,0) Reference -->
            <path d="M 0,0 L 170,0 M 0,0 L 0,110" class="center" style="stroke: #fcd34d; stroke-dasharray: none; opacity: 0.5;" />

            <!-- ========================================== -->
            <!-- 1. 제1단면: 오른쪽이 올라온 ㄴ(니은)자 형태 -->
            <!-- ========================================== -->
            <path d="
                M 0,0 
                L 150,0 
                L 150,75 
                A 21 21 0 0 1 108,75 
                L 108,10 
                L 0,10 
                Z" 
            class="outline" />
            <!-- 설명: A 21 21 0 0 1 (Sweep-flag=1)로 변경하여 반원이 위로(∩) 볼록하게 솟아오름 -->

            <!-- ========================================== -->
            <!-- 2. 제2단면: 좌측 기둥 및 위로 솟은 반원 -->
            <!-- ========================================== -->
            <path d="
                M 0,10 
                L 0,25 
                A 15 15 0 0 1 30,25 
                L 30,10" 
            class="outline" />
            <!-- 설명: A 15 15 0 0 1 로 변경하여 반원이 위로(∩) 솟아오름 -->

            <!-- ========================================== -->
            <!-- 3. 제3단면: 좌측 반원 꼭대기에서 우측으로 연결되는 지지대(Rib) -->
            <!-- ========================================== -->
            <!-- 좌측 꼭대기(15, 40)에서 우측 기둥 모서리(108, 75)로 사선 연결 -->
            <path d="M 15,40 L 108,75" class="outline" />


            <!-- ========================================== -->
            <!-- 4. 단면의 구멍 (정면에서 보이는 실선) -->
            <!-- ========================================== -->
            <circle cx="15" cy="25" r="5" class="outline" />  <!-- 좌측 귀 구멍 -->
            <circle cx="129" cy="75" r="8" class="outline" /> <!-- 우측 귀 구멍 -->


            <!-- ========================================== -->
            <!-- 5. 숨겨진 구멍 (바닥 4홀 은선) -->
            <!-- ========================================== -->
            <path d="M 54.5,0 L 54.5,10 M 65.5,0 L 65.5,10" class="hidden" /> <!-- 좌측 쌍 -->
            <path d="M 114.5,0 L 114.5,10 M 125.5,0 L 125.5,10" class="hidden" /> <!-- 우측 쌍 -->


            <!-- ========================================== -->
            <!-- 6. 중심선 (Center Lines) -->
            <!-- ========================================== -->
            <path d="M 0,25 L 40,25 M 15,10 L 15,50" class="center" /> <!-- 좌측 원 중심 -->
            <path d="M 100,75 L 160,75 M 129,40 L 129,110" class="center" /> <!-- 우측 원 중심 -->
            <path d="M 60,-5 L 60,15 M 120,-5 L 120,15" class="center" /> <!-- 바닥 홀 중심 -->

        </g>
    </svg>
</body>
</html>
