<!DOCTYPE html>
<html>
<head>
    <title>SECAD Drawing 174 - Final Fixed Front View</title>
    <style>
        body { margin: 0; background-color: #0f172a; color: #fff; font-family: monospace; display: flex; justify-content: center; align-items: center; height: 100vh; }
        svg { background-color: #1e293b; border: 1px solid #334155; box-shadow: 0 10px 30px rgba(0,0,0,0.5); }
        .solid-outline { fill: #1e293b; stroke: #38bdf8; stroke-width: 2; stroke-linecap: round; stroke-linejoin: round; }
        .rib-line { fill: none; stroke: #38bdf8; stroke-width: 2; stroke-linecap: round; }
        .hidden { fill: none; stroke: #94a3b8; stroke-width: 1; stroke-dasharray: 4,3; }
        .center { fill: none; stroke: #ef4444; stroke-width: 0.8; stroke-dasharray: 12,3,3,3; }
        .grid { stroke: #334155; stroke-width: 0.5; }
    </style>
</head>
<body>
    <svg width="800" height="600">
        <pattern id="grid" width="20" height="20" patternUnits="userSpaceOnUse">
            <path d="M 20 0 L 0 0 0 20" fill="none" class="grid"/>
        </pattern>
        <rect width="100%" height="100%" fill="url(#grid)" />
        <text x="20" y="40" font-family="monospace" font-size="20" fill="#38bdf8">SECAD FINAL: ONE-PIECE OUTLINE (제1+2단면 통합)</text>
        <text x="20" y="60" font-family="monospace" font-size="12" fill="#94a3b8">DIRECTOR'S CORRECTION: PERFECT 'L' SHAPE & UPWARD ARCS</text>

        <g transform="translate(150, 450) scale(3, -3)">
            
            <!-- X/Y Axis (0,0) Reference -->
            <path d="M 0,0 L 170,0 M 0,0 L 0,110" class="center" style="stroke: #fcd34d; stroke-dasharray: none; opacity: 0.3;" />

            <!-- ========================================== -->
            <!-- 1. 제1단면 & 제2단면 통합 외곽선 (One-Piece Outline) -->
            <!-- ========================================== -->
            <!-- 설명: 
                 1. (0,25) 좌측 기둥에서 시작하여 바닥을 돌아 우측 기둥 끝(150,75)까지 ㄱ자로 올라감.
                 2. 우측 윗부분 반원을 윗방향(Sweep-flag=1)으로 그려 (108,75)로 안착.
                 3. 아래로 내려와 ㄴ자 안쪽 구석(108,10)을 찍고, 좌측 기둥(30,10)으로 평행 이동 (이것이 ㄴ자의 완성).
                 4. 좌측 기둥을 타고 올라가(30,25), 좌측 윗부분 반원도 윗방향(Sweep-flag=1)으로 그려 (0,25) 원점으로 돌아옴. 
            -->
            <path d="
                M 0,25 
                L 0,0 
                L 150,0 
                L 150,75 
                A 21 21 0 0 1 108,75 
                L 108,10 
                L 30,10 
                L 30,25 
                A 15 15 0 0 1 0,25 
                Z" 
            class="solid-outline" />

            <!-- ========================================== -->
            <!-- 3. 제3단면: 지지대 (Rib) -->
            <!-- ========================================== -->
            <!-- 좌측 꼭대기(15, 40)에서 우측 기둥(108, 75)으로 연결 -->
            <path d="M 15,40 L 108,75" class="rib-line" />

            <!-- ========================================== -->
            <!-- 단면의 구멍 (정면 실선) -->
            <!-- ========================================== -->
            <circle cx="15" cy="25" r="5" class="rib-line" />  <!-- 좌측 귀 -->
            <circle cx="129" cy="75" r="8" class="rib-line" /> <!-- 우측 귀 -->

            <!-- ========================================== -->
            <!-- 숨겨진 구멍 (바닥 4홀 은선) -->
            <!-- ========================================== -->
            <path d="M 54.5,0 L 54.5,10 M 65.5,0 L 65.5,10" class="hidden" />
            <path d="M 114.5,0 L 114.5,10 M 125.5,0 L 125.5,10" class="hidden" />

            <!-- ========================================== -->
            <!-- 중심선 (Center Lines) -->
            <!-- ========================================== -->
            <path d="M -5,25 L 40,25 M 15,10 L 15,50" class="center" /> 
            <path d="M 100,75 L 160,75 M 129,40 L 129,110" class="center" />
            <path d="M 60,-5 L 60,15 M 120,-5 L 120,15" class="center" />

        </g>
    </svg>
</body>
</html>
